<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Career Coach</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="chat-container">
            <header class="header">
                <h1>AI Career Coach</h1>
                <p class="subtitle">Your personal guide to career development</p>
                <button id="theme-toggle-btn" class="theme-toggle-btn" aria-label="Toggle theme">
                    🌓
                </button>
            </header>

            <div class="chat-box" id="chat-box"></div>
            
            <div class="controls-container">
                <div class="input-group">
                    <div class="input-wrapper">
                        <input 
                            type="text" 
                            id="user-input" 
                            class="user-input" 
                            placeholder="Ask me anything about your career..."
                            aria-label="Your message"
                        >
                        <div class="button-group">
                            <button id="send-btn" class="send-btn" aria-label="Send message">Send</button>
                            <button id="recommend-btn" class="recommend-btn" aria-label="Get skill recommendations" title="Get skill recommendations">🎯</button>
                        </div>
                    </div>
                </div>
                
                <div class="upload-container">
                    <div class="file-input-group">
                        <label for="resume">Resume:</label>
                        <input type="file" id="resume" accept=".pdf,.doc,.docx" class="file-input">
                        <div id="resume-preview" class="file-preview"></div>
                    </div>
                    <div class="file-input-group">
                        <label for="coverLetter">Cover Letter:</label>
                        <input type="file" id="coverLetter" accept=".pdf,.doc,.docx" class="file-input">
                        <div id="coverLetter-preview" class="file-preview"></div>
                    </div>
                    <button id="submitDocuments" class="submit-btn" disabled>Submit Documents</button>
                </div>

                <div class="interview-prep-container">
                    <h3>Interview Preparation</h3>
                    <div class="interview-form">
                        <div class="form-group">
                            <label for="jobRole">Job Role:</label>
                            <input type="text" id="jobRole" placeholder="e.g., Software Engineer" class="form-input">
                        </div>
                        <div class="form-group">
                            <label for="interviewStage">Interview Stage:</label>
                            <select id="interviewStage" class="form-input">
                                <option value="">Select Stage</option>
                                <option value="initial">Initial Screening</option>
                                <option value="technical">Technical Interview</option>
                                <option value="behavioral">Behavioral Interview</option>
                                <option value="final">Final Round</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="experienceLevel">Experience Level:</label>
                            <select id="experienceLevel" class="form-input">
                                <option value="">Select Level</option>
                                <option value="entry">Entry Level</option>
                                <option value="mid">Mid Level</option>
                                <option value="senior">Senior Level</option>
                                <option value="lead">Lead/Manager</option>
                            </select>
                        </div>
                        <button id="prepareInterview" class="interview-btn">Prepare for Interview</button>
                    </div>
                </div>

                <div class="career-guidance-container">
                    <h3>Career Path Guidance</h3>
                    <div class="career-form">
                        <div class="form-group">
                            <label for="careerInterests">Career Interests:</label>
                            <div class="tag-input-container">
                                <input type="text" id="interestInput" class="tag-input" placeholder="Type and press Enter">
                                <div id="interestTags" class="tag-container"></div>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label for="currentSkills">Current Skills:</label>
                            <div class="tag-input-container">
                                <input type="text" id="skillInput" class="tag-input" placeholder="Type and press Enter">
                                <div id="skillTags" class="tag-container"></div>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label for="careerGoals">Career Goals:</label>
                            <textarea id="careerGoals" class="form-input textarea" placeholder="What are your career goals for the next 1-3 years?"></textarea>
                        </div>
                        
                        <div class="form-group">
                            <label for="careerExperience">Experience Level:</label>
                            <select id="careerExperience" class="form-input">
                                <option value="">Select Level</option>
                                <option value="student">Student/Recent Graduate</option>
                                <option value="entry">Entry Level (0-2 years)</option>
                                <option value="mid">Mid Level (2-5 years)</option>
                                <option value="senior">Senior Level (5+ years)</option>
                                <option value="lead">Lead/Manager</option>
                            </select>
                        </div>
                        
                        <button id="getCareerGuidance" class="career-btn">Get Career Guidance</button>
                    </div>
                </div>

                <div class="job-search-container">
                    <h3>Job Search</h3>
                    <div class="job-search-form">
                        <div class="form-group">
                            <label for="searchJobRole">Job Role:</label>
                            <input type="text" id="searchJobRole" class="form-input" placeholder="e.g., Software Engineer">
                        </div>
                        
                        <div class="form-group">
                            <label for="searchJobLocation">Location:</label>
                            <input type="text" id="searchJobLocation" class="form-input" placeholder="e.g., New York">
                        </div>
                        
                        <div class="form-group">
                            <label for="searchJobExperience">Experience Level:</label>
                            <select id="searchJobExperience" class="form-input">
                                <option value="">Any Level</option>
                                <option value="entry">Entry Level</option>
                                <option value="mid">Mid Level</option>
                                <option value="senior">Senior Level</option>
                                <option value="executive">Executive</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label for="searchJobType">Job Type:</label>
                            <select id="searchJobType" class="form-input">
                                <option value="">Any Type</option>
                                <option value="full-time">Full Time</option>
                                <option value="part-time">Part Time</option>
                                <option value="contract">Contract</option>
                                <option value="remote">Remote</option>
                            </select>
                        </div>
                        
                        <button id="searchJobs" class="job-search-btn">Search Jobs</button>
                    </div>
                    
                    <div id="jobResults" class="job-results">
                        <!-- Job results will be dynamically inserted here -->
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
